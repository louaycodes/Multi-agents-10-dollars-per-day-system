version: '3.9'

# ============================================================
# docker-compose.agents.yml
# ISOLATED agents stack — does NOT touch portfolio services.
#
# Ports (all different from standard to avoid portfolio conflicts):
#   postgres → 5433 (not 5432)
#   redis    → 6380 (not 6379)
#   ollama   → 11435 (not 11434)
#   app      → 8001
#
# Networks: agents_network (private bridge, isolated)
# Volumes:  agents_* (separate from any portfolio volumes)
# ============================================================

networks:
  agents_network:
    driver: bridge
    name: agents_network
    ipam:
      config:
        - subnet: 172.30.0.0/24   # Unique subnet to avoid overlap

volumes:
  agents_postgres_data:
    name: agents_postgres_data
  agents_redis_data:
    name: agents_redis_data
  agents_ollama_data:
    name: agents_ollama_data

services:

  # ──────────────────────────────────────────────
  # PostgreSQL — port 5433 (not 5432)
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:14-alpine
    container_name: agents_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-agents_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"   # 5433 external, 5432 internal (Docker DNS)
    volumes:
      - agents_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - agents_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-agents_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────
  # Redis — port 6380 (not 6379)
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agents_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6380:6379"   # 6380 external, 6379 internal
    volumes:
      - agents_redis_data:/data
    networks:
      - agents_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ──────────────────────────────────────────────
  # Ollama (local LLM) — port 11435 (not 11434)
  # ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: agents_ollama
    ports:
      - "11435:11434"   # 11435 external, 11434 internal
    volumes:
      - agents_ollama_data:/root/.ollama
    networks:
      - agents_network
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    restart: unless-stopped
    # NOTE: Ollama has no built-in healthcheck — app has retry logic
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────
  # Main App — port 8001
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agents_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database — use Docker service names (internal DNS)
      DB_HOST: postgres
      DB_PORT: "5432"          # Internal port inside Docker network
      DB_NAME: ${DB_NAME:-agents_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis — internal
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # LLM — Ollama internal URL
      LLM_TYPE: ${LLM_TYPE:-ollama}
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Niche: Reselling
      FACEBOOK_API_TOKEN: ${FACEBOOK_API_TOKEN:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_MARKETPLACE_ENABLED: ${FACEBOOK_MARKETPLACE_ENABLED:-false}
      SHOPEE_ENABLED: ${SHOPEE_ENABLED:-false}

      # Niche: Gigs (Mturk)
      MTURK_ACCESS_KEY: ${MTURK_ACCESS_KEY:-}
      MTURK_SECRET_KEY: ${MTURK_SECRET_KEY:-}
      MTURK_SANDBOX: ${MTURK_SANDBOX:-true}
      MTURK_REGION: ${MTURK_REGION:-us-east-1}

      # Niche: Gigs (Fiverr API)
      FIVERR_API_TOKEN: ${FIVERR_API_TOKEN:-}
      FIVERR_ENABLED: ${FIVERR_ENABLED:-false}

      # Niche: Affiliate
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USERNAME: ${REDDIT_USERNAME:-}
      REDDIT_PASSWORD: ${REDDIT_PASSWORD:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-MultiAgentSystem/1.0}
      AMAZON_AFFILIATE_TAG: ${AMAZON_AFFILIATE_TAG:-}
      DEV_TO_API_KEY: ${DEV_TO_API_KEY:-}

      # System
      TIMEZONE: ${TIMEZONE:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DAILY_TARGET: ${DAILY_TARGET:-10.0}

    ports:
      - "8001:5000"
    volumes:
      - ./logs:/app/logs
    networks:
      - agents_network
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
